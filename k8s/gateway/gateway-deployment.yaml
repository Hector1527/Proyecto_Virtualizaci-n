# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    app: gateway
    project: el-quetzal
    team: glitch-tec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
      project: el-quetzal
      team: glitch-tec
  template:
    metadata:
      labels:
        app: gateway
        project: el-quetzal
        team: glitch-tec
    spec:
      hostname: gateway-glitch-tec
      containers:
      - name: gateway
        image: javierini/elquetzal-gateway:2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: nginx
        configMap:
          name: gateway-config-glitch-tec
          items:
          - key: nginx.conf
            path: default.conf
