# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: v1
kind: Service
metadata:
  name: gateway-loadbalancer-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    app: gateway
    project: el-quetzal
    team: glitch-tec
spec:
  type: LoadBalancer
  selector:
    app: gateway
    project: el-quetzal
    team: glitch-tec
  ports:
  - name: http
    port: 8080
    targetPort: http
