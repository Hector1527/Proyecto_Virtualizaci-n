# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: v1
kind: Service
metadata:
  name: catalogo-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    app: catalogo
    project: el-quetzal
    team: glitch-tec
spec:
  type: ClusterIP
  selector:
    app: catalogo
    project: el-quetzal
    team: glitch-tec
  ports:
  - name: http
    port: 5000
    targetPort: http
