# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: v1
kind: Service
metadata:
  name: frontend-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    app: frontend
    project: el-quetzal
    team: glitch-tec
spec:
  type: ClusterIP
  selector:
    app: frontend
    project: el-quetzal
    team: glitch-tec
  ports:
  - name: http
    port: 80
    targetPort: http
