# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    app: postgres
    project: el-quetzal
    team: glitch-tec
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
