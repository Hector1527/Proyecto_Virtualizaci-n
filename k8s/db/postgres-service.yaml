# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: v1
kind: Service
metadata:
  name: postgres-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    app: postgres
    project: el-quetzal
    team: glitch-tec
spec:
  type: ClusterIP
  selector:
    app: postgres
    project: el-quetzal
    team: glitch-tec
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
