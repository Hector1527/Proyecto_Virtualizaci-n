# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reportes-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    app: reportes
    project: el-quetzal
    team: glitch-tec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reportes
      project: el-quetzal
      team: glitch-tec
  template:
    metadata:
      labels:
        app: reportes
        project: el-quetzal
        team: glitch-tec
    spec:
      hostname: reportes-glitch-tec
      containers:
      - name: reportes
        image: javierini/elquetzal-reportes:2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/reportes/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/reportes/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/reportes/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        env:
        - name: INVENTARIO_URL
          valueFrom:
            configMapKeyRef:
              name: app-config-glitch-tec
              key: INVENTARIO_URL
        - name: PEDIDOS_URL
          valueFrom:
            configMapKeyRef:
              name: app-config-glitch-tec
              key: PEDIDOS_URL
