# Template: render with scripts/configure-project.sh before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clientes-__ID_EQUIPO__
  namespace: proyecto-2-__ID_EQUIPO__
  labels:
    app: clientes
    project: el-quetzal
    team: __ID_EQUIPO__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clientes
      project: el-quetzal
      team: __ID_EQUIPO__
  template:
    metadata:
      labels:
        app: clientes
        project: el-quetzal
        team: __ID_EQUIPO__
    spec:
      hostname: clientes-__ID_EQUIPO__
      containers:
      - name: clientes
        image: javierini/elquetzal-clientes:2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/clientes/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/clientes/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/clientes/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config-__ID_EQUIPO__
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config-__ID_EQUIPO__
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config-__ID_EQUIPO__
              key: CLIENTES_DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-__ID_EQUIPO__
              key: CLIENTES_DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-__ID_EQUIPO__
              key: CLIENTES_DB_PASSWORD
      initContainers:
      - name: wait-postgres
        image: busybox:1.37
        command:
        - sh
        - -c
        - until nc -z "$DB_HOST" "$DB_PORT"; do echo "Esperando PostgreSQL..."; sleep
          2; done
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config-__ID_EQUIPO__
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config-__ID_EQUIPO__
              key: DB_PORT
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
