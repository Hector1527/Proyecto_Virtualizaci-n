# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    app: frontend
    project: el-quetzal
    team: glitch-tec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      project: el-quetzal
      team: glitch-tec
  template:
    metadata:
      labels:
        app: frontend
        project: el-quetzal
        team: glitch-tec
    spec:
      hostname: frontend-glitch-tec
      containers:
      - name: frontend
        image: javierini/elquetzal-frontend:2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
