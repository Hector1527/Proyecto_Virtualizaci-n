        ('1143323', 'José Rosales', NULL)
    ON CONFLICT (carne) DO UPDATE SET nombre = EXCLUDED.nombre;
  seeds-inventario.sql: |
    INSERT INTO productos (sku, nombre, categoria, precio_q, stock)
    VALUES
