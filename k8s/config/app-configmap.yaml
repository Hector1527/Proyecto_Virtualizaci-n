# Final manifest: apply directly from k8s/ for Glitch Tec (glitch-tec).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-glitch-tec
  namespace: proyecto-2-glitch-tec
  labels:
    project: el-quetzal
    team: glitch-tec
data:
  DB_HOST: postgres-glitch-tec
  DB_PORT: '5432'
  INVENTARIO_DB_NAME: inventario_db
  CLIENTES_DB_NAME: clientes_db
  PEDIDOS_DB_NAME: pedidos_db
  UMBRAL_STOCK_BAJO: '10'
  INVENTARIO_URL: http://inventario-glitch-tec:5000
  PEDIDOS_URL: http://pedidos-glitch-tec:5000
