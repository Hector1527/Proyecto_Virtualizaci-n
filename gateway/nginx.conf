server {
    listen 80;
    server_name _;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /health {
        default_type text/plain;
        return 200 "Gateway El Quetzal funcionando\n";
    }
    location /api/catalogo {
        proxy_pass http://catalogo-glitch-tec:5000;
    }
    location /api/clientes {
        proxy_pass http://clientes-glitch-tec:5000;
    }
    location /api/inventario {
        proxy_pass http://inventario-glitch-tec:5000;
    }
    location /api/pedidos {
        proxy_pass http://pedidos-glitch-tec:5000;
    }
    location /api/reportes {
        proxy_pass http://reportes-glitch-tec:5000;
    }
    location / {
        proxy_pass http://frontend-glitch-tec:80;
    }
}
